      - run: python3 -I eval/lantern-vault/test_dungeon_ai.py
      - run: python3 -I eval/lantern-vault/check_dungeon_slots.py --cap 0 --check eval/lantern-vault/dungeon-slots-tokens.json eval/lantern-vault/dungeon-slots-results.json eval/lantern-vault/dungeon-entities-tokens.json eval/lantern-vault/dungeon-entities-results.json
