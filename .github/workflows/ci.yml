name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo +stable doc --no-deps --locked
      - run: cargo +stable build --release --locked
      - run: cargo +stable build --bin gamectx --example dungeon --example info_tools --example conversation_tools --example character_tools --locked
      - run: cargo +stable test --example character_tools --locked
      - run: python3 -I eval/test_dungeon_agent.py
      - run: python3 -I eval/workflow_cases.py --cap 0 --check
      - run: python3 -I eval/dungeon_social_cases.py --cap 0 --check
      - run: python3 -I eval/conversation_cases.py --cap 0 --check
      - run: python3 -I eval/dungeon_trade_cases.py --cap 0
      - run: python3 -I eval/check_dungeon_feedback.py --cap 0
      - run: python3 -I eval/lore_cases.py --cap 0 --check
      - run: python3 -I eval/dungeon_knowledge_cases.py --cap 0
      - run: python3 -I eval/test_dungeon_knowledge.py
      - run: python3 -I eval/conversation_patch_cases.py --cap 0
      - run: python3 -I eval/conversation_time_cases.py --cap 0
      - run: python3 -I eval/check_conversation_patch.py --cap 0
      - run: python3 -I eval/location_cases.py --cap 0
      - run: python3 -I eval/world_cases.py --cap 0
      - run: python3 -I eval/character_cases.py --cap 0
      - run: python3 -I eval/routines_cases.py --cap 0
      - run: python3 -I eval/routine_improvements_cases.py --cap 0
      - run: python3 -I eval/test_adversarial.py
      - run: python3 -I eval/test_count_cache.py
      - run: python3 -I eval/adversarial_probe.py --cap 0 --require-fixed
      - run: python3 -I eval/adversarial_cases.py --cap 0
      - run: python3 -I eval/time_assessment_cases.py --cap 0
      - run: python3 -I eval/life_cases.py --cap 0
      - run: python3 -I eval/continuity_cases.py --cap 0
      - run: python3 -I eval/episodic_cases.py --cap 0
      - run: python3 -I eval/initiative_cases.py --cap 0
      - run: python3 -I eval/continuity_context_cases.py --cap 0
      - run: python3 -I eval/life_model_eval.py --cap 0 --check eval/life-model-tokens.json
      - run: python3 -I eval/life_model_eval.py --cap 0 --check eval/life-model-results.json
      - run: python3 -I eval/life_speech_cases.py --cap 0
      - run: python3 -I eval/archetype_cases.py --cap 0 --check eval/archetype-party-results.json
      - run: python3 -I eval/living_cases.py --cap 0 --check eval/living-world-results.json
      - run: python3 -I eval/living_measure_check.py --cap 0 --check eval/living-world-timing.json
      - run: python3 -I eval/visual_cases.py --cap 0 --check eval/visual-results.json
      - run: cargo +stable test --example visual --locked
      - run: cargo +stable test --example living-world --locked
      - run: cargo +stable test --example party --locked
      - run: python3 -I eval/life_model_v2_eval.py --cap 0 --check eval/life-model-v2-tokens.json
      - run: python3 -I eval/life_model_v2_eval.py --cap 0 --check eval/life-model-v2-results.json
      - run: python3 -I eval/life_model_v2_review.py --cap 0 --check
      - run: cargo +stable test --example character-speech --locked
      - run: python3 -I eval/validation_reference.py > target/validation-oracle.json
      - run: rustc --edition=2021 -O eval/validation_check.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/validation-check
      - run: ./target/validation-check
      - run: cargo +stable test --example character-life --locked
      - run: python3 -I eval/check_character_limits.py --cap 0 --check eval/character-limit-summary.json
      - run: cargo +stable test --example dungeon --locked
      - run: python3 -I eval/info_inventory_cases.py --cap 0
      - run: python3 -I eval/interaction_cases.py --cap 0
      - run: python3 -I eval/interaction_measure.py --cap 0 --check eval/interaction-results.json
      - run: python3 -I eval/dungeon_natural_cases.py --cap 0
      - run: python3 -I eval/natural_scaled_check.py --cap 0
      - run: python3 -I eval/check_natural_model.py --cap 0 eval/natural-tokens.json eval/natural-results.json eval/natural-v2-tokens.json eval/natural-v2-results.json
      - run: python3 -I eval/check_lore_model.py --cap 0 eval/lore-stock-tokens.json eval/lore-stock-results.json
      - run: python3 -I eval/check_lore_model.py --cap 0 eval/lore-tokens.json eval/lore-results.json eval/lore-v2-tokens.json eval/lore-v2-results.json eval/lore-native-tokens.json eval/lore-native-results.json eval/lore-fresh-tokens.json eval/lore-fresh-results.json eval/lore-retest-tokens.json eval/lore-retest-results.json eval/lore-extra-tokens.json eval/lore-extra-results.json eval/lore-repair-tokens.json eval/lore-repair-results.json
      - run: python3 -I eval/test_dungeon_ai.py
      - run: python3 -I eval/check_dungeon_slots.py --cap 0 --check eval/dungeon-slots-tokens.json eval/dungeon-slots-results.json eval/dungeon-entities-tokens.json eval/dungeon-entities-results.json
      - run: python3 -I eval/check_dungeon_social.py --cap 0 eval/dungeon-social-tokens.json eval/dungeon-social-results.json eval/dungeon-social-guided-tokens.json eval/dungeon-social-guided-results.json eval/dungeon-social-focused-tokens.json eval/dungeon-social-focused-results.json
      - run: python3 -I eval/dungeon_cases.py --cap 0 --check --audit eval/dungeon-results.json
      - run: python3 -I eval/check_dungeon_agent.py --cap 0 eval/dungeon-model-tokens.json eval/dungeon-model-results.json
      - run: python3 -I eval/optimization_cases.py --check
      - run: python3 -I eval/optimization_measure.py --cap 0 --check
      - run: python3 -I eval/optimization_measure.py --cap 0 --check-tokens eval/optimization-tokens.json
      - run: python3 -I eval/optimization_model_eval.py --cap 0 --check eval/optimization-heldout-tokens.json
      - run: python3 -I eval/optimization_model_eval.py --cap 0 --check eval/optimization-heldout-results.json
      - run: python3 -I eval/optimization_model_pilot.py --cap 0 --check eval/optimization-pilot-results.json
      - run: python3 -I eval/query_upgrade_eval.py --check eval/query-guidance-results.json --cap 0
      - run: python3 -I eval/summarize_query_upgrade.py --check
      - run: python3 -I eval/test_query_upgrade.py
      - run: rustc --edition=2021 -O eval/query_plan_check.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/query-plan-check
      - run: rustc --edition=2021 -O eval/query_compare.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/query-compare
      - run: python3 -I eval/query_optimization_check.py
      - run: python3 -I eval/relevance_eval.py
      - run: python3 -I eval/test_query_eval.py
      - run: python3 -I eval/test_query_workflow.py
      - run: python3 -I eval/test_brain.py
      - run: python3 -I eval/test_brain_accuracy.py
      - run: python3 -I eval/test_brain_cache.py
      - run: python3 -I eval/test_runtime.py
      - run: python3 -I eval/test_integration.py
      - run: python3 -I eval/test_facts.py
      - run: python3 -I eval/test_upgrades.py
      - run: python3 -I eval/test_release_model.py
      - run: python3 -I eval/release_model_eval.py --check --cap 0 --output eval/release-model-tokens.json
      - run: python3 -I eval/release_model_eval.py --check --cap 0 --output eval/release-model-results.json
      - run: python3 -I eval/summarize_release_model.py --check
      - run: rustc --edition=2021 -O eval/upgrades_check.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/upgrades-check
      - run: python3 -I eval/upgrades_eval.py --check
      - run: rustc --edition=2021 -O eval/upgrades_bench.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/upgrades-bench
      - run: ./target/upgrades-bench > /dev/null
      - run: rustc --edition=2021 -O eval/facts_check.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/facts-check
      - run: python3 -I eval/facts_eval.py --check
      - run: rustc --edition=2021 -O eval/integration_check.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/integration-check
      - run: python3 -I eval/integration_eval.py --check
      - run: rustc --edition=2021 -O eval/integration_bench.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/integration-bench
      - run: ./target/integration-bench > /dev/null
      - run: python3 -I eval/query_meaning_eval.py --check --cap 0
      - run: python3 -I eval/prefix_cache_eval.py --cap 0
      - run: rustc --edition=2021 -O eval/runtime_check.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/runtime-check
      - run: python3 -I eval/runtime_eval.py --check
      - run: rustc --edition=2021 -O eval/runtime_bench.rs -L dependency=target/release/deps --extern gamectx=target/release/libgamectx.rlib -o target/runtime-bench
      - run: ./target/runtime-bench > /dev/null
      - run: python3 -I eval/brain_cache_eval.py --check
      - run: python3 -I eval/brain_accuracy_eval.py --check
      - run: python3 -I eval/brain_eval.py --check
      - run: python3 -I eval/query_workflow_eval.py --check --seeds 7,101,202,303 --cap 0
      - run: python3 -I eval/query_eval.py --differential 3000 --cap 0

  kit-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo +stable build --locked
      - run: python3 -I eval/kit_eval.py --check
      - run: python3 -I eval/local_cases.py --check
      - run: python3 -I eval/test_ollama.py
      - run: python3 -I eval/check_local_model.py --cap 0 eval/local-model-tokens.json eval/local-model-results.json eval/local-tools-tokens.json eval/local-guidance-results.json
      - run: cargo +stable fmt --manifest-path bindings/native/Cargo.toml --check
      - run: cargo +stable clippy --manifest-path bindings/native/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +stable test --manifest-path bindings/native/Cargo.toml --locked
      - run: cargo +stable build --manifest-path bindings/native/Cargo.toml --locked
      - run: python3 -I eval/workflow_cases.py --cap 0 --check-bindings
      - run: python3 -I eval/conversation_cases.py --cap 0 --check-bindings
      - run: python3 -I eval/lore_cases.py --cap 0 --check-bindings
      - run: python3 -I eval/optimization_cases.py --check-bindings
      - run: python3 -I eval/kit_bindings_check.py --csharp-fixtures target/kit-csharp
      - run: node eval/kit_bindings_check.mjs
      - run: python3 -I eval/local_bindings_check.py
      - run: python3 -I eval/information_bindings_check.py --cap 0 --fixtures target/information-csharp
      - run: node eval/information_bindings_check.mjs --cap 0 target/information-csharp
      - run: python3 -I eval/character_session_cases.py --cap 0 --fixtures target/character-csharp
      - run: node eval/character_bindings_check.mjs
      - run: python3 -I eval/routine_bindings_check.py --cap 0
      - run: node eval/routine_bindings_check.mjs
      - run: python3 -I eval/routine_detail_bindings_check.py --cap 0
      - run: node eval/routine_detail_bindings_check.mjs
      - run: python3 -I eval/adversarial_bindings_check.py --cap 0
      - run: node eval/adversarial_bindings_check.mjs
      - run: python3 -I eval/life_bindings_check.py --cap 0
      - run: python3 -I eval/life_speech_cases.py --cap 0 --check-bindings
      - run: python3 -I eval/archetype_cases.py --cap 0 --check-bindings
      - run: python3 -I eval/living_cases.py --cap 0 --check-bindings
      - run: python3 -I eval/visual_cases.py --cap 0 --check-bindings
      - run: node eval/visual_bindings_check.mjs
      - run: node eval/living_bindings_check.mjs
      - run: node eval/archetype_bindings_check.mjs
      - run: node eval/life_bindings_check.mjs
      - run: sudo apt-get update && sudo apt-get install -y mono-mcs
      - run: mcs -out:target/kit-csharp/Check.exe bindings/csharp/GamectxClient.cs bindings/csharp/Check.cs
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/kit-csharp/requests.txt target/kit-csharp/expected.txt
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/local-csharp/requests.txt target/local-csharp/expected.txt
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/information-csharp/requests.txt target/information-csharp/expected.txt
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/character-csharp/requests.txt target/character-csharp/expected.txt
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/routine-csharp/requests.txt target/routine-csharp/expected.txt
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/routine-detail-csharp/requests.txt target/routine-detail-csharp/expected.txt
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/adversarial-csharp/requests.txt target/adversarial-csharp/expected.txt
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/life-csharp/requests.txt target/life-csharp/expected.txt
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/archetype-party-csharp/requests.txt target/archetype-party-csharp/expected.txt
      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/living-world-csharp/requests.txt target/living-world-csharp/expected.txt

      - run: LD_LIBRARY_PATH=bindings/native/target/debug mono target/kit-csharp/Check.exe examples/kit/project.json target/visual-csharp/requests.txt target/visual-csharp/expected.txt

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.82 --profile minimal
      - run: cargo +1.82 test --locked
      - run: cargo +1.82 test --manifest-path bindings/native/Cargo.toml --locked
