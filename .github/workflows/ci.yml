      - run: python3 -I eval/character/character_cases.py --cap 0
      - run: python3 -I eval/character/routines_cases.py --cap 0
      - run: python3 -I eval/character/routine_improvements_cases.py --cap 0
      - run: python3 -I eval/local/test_adversarial.py
