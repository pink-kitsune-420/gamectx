name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo +stable doc --no-deps --locked
      - run: cargo +stable build --release --locked
      - run: cargo +stable build --bin gamectx --example dungeon --example info_tools --example conversation_tools --example character_tools --locked
      - run: cargo +stable test --example character_tools --locked
      - run: cargo +stable test --example visual --locked
      - run: cargo +stable test --example living-world --locked
      - run: cargo +stable test --example party --locked
      - run: cargo +stable test --example character-speech --locked
      - run: cargo +stable test --example character-life --locked
      - run: cargo +stable test --example dungeon --locked

  kit-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo +stable build --locked
      - run: cargo +stable fmt --manifest-path bindings/native/Cargo.toml --check
      - run: cargo +stable clippy --manifest-path bindings/native/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +stable test --manifest-path bindings/native/Cargo.toml --locked
      - run: cargo +stable build --manifest-path bindings/native/Cargo.toml --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.82 --profile minimal
      - run: cargo +1.82 test --locked
      - run: cargo +1.82 test --example dungeon --locked
      - run: cargo +1.82 test --manifest-path bindings/native/Cargo.toml --locked

