<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Lantern Vault</title><link rel="stylesheet" href="/studio.css"></head><body><header><strong>LANTERN VAULT · PLAYER 2</strong><span>AI runs on the host</span></header><main class="guest-layout"><section id="join-panel"><h1>Join your friend's game</h1><p>Ask the host for the session code in Settings → Play together.</p><form id="join-form"><label>Session code<input id="join-code" maxlength="48" autocomplete="off" required></label><button class="primary">Join conversation</button></form></section><section id="guest-play" hidden><h1 id="guest-room"></h1><p id="guest-description"></p><p id="guest-status" role="status"></p><div id="guest-transcript" role="log" aria-live="polite"></div><div id="guest-reply" hidden><strong id="guest-speaker"></strong><p id="guest-speech"></p><button id="guest-read">I've read this reply</button></div><form id="guest-chat"><label>Addressing<select id="guest-npc"><option>merchant</option><option>keeper</option></select></label><label>Your words<input id="guest-input" maxlength="1024" autocomplete="off" required></label><button id="guest-send" class="primary">Send as player_2</button></form><p class="muted">The host controls travel, world actions, models and voice. Your device sends text and displays the shared conversation.</p></section><p id="guest-error" role="alert"></p></main><script type="module" src="/guest.mjs"></script></body></html>
